[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent-platform"
version = "1.0.0"
description = "AI-Powered Engineering & DevOps Agent Platform (modular monolith)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "openai>=1.10.0",
    "tenacity>=8.2.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.19.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
# structlog is optional: app/core/logging.py falls back to stdlib logging when absent
log = ["structlog>=24.1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    # The codebase follows the platform's documented style (Optional[X],
    # quoted forward refs, PEP-435 str enums) so these modernisation rules
    # are disabled on purpose:
    "UP045",  # Optional[X] -> X | None
    "UP037",  # remove quotes from annotations
    "UP006",  # typing.List -> list (kept where specs use it)
    "UP042",  # str, Enum -> StrEnum
    "UP017",  # datetime.timezone.utc
    "UP041",  # asyncio.TimeoutError alias
    "UP035",  # deprecated typing imports
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
